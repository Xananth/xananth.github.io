<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XANANTH // NET-DECK</title>
  <!-- Google Fonts for Retro Display & Developer Monospace -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <!-- External Master Stylesheet -->
  <link rel="stylesheet" href="./master.css" />
</head>
<body class="crt-enabled">

  <!-- =========================================================================
       STICKY TOP SYSTEM BAR
       ========================================================================= -->
  <header class="top-bar">
    <!-- Left: Brand Logo & Status -->
    <div class="brand-cluster">
      <div class="brand-logo-wrap" title="Xananth // Net-Deck">
        <img src="Xananth Logo Fold 3 Inner~2.png" alt="Xananth Logo" onerror="this.style.display='none'; document.getElementById('xananth-svg-logo').style.display='block';" />
        <svg id="xananth-svg-logo" style="display:none;" viewBox="0 0 200 185" xmlns="http://www.w3.org/2000/svg">
          <g fill="#8de500">
            <polygon points="74,12 126,12 142,42 63,118 47,62" />
            <polygon points="36,80 51,131 24,157 8,130" />
            <polygon points="56,149 62,172 34,172" />
            <polygon points="150,58 192,130 168,172 75,172 68,139" />
          </g>
          <text x="77" y="164" fill="#06040b" font-family="cursive, sans-serif" font-weight="900" font-style="italic" font-size="25" letter-spacing="0.5">ananth</text>
        </svg>
      </div>
      <div class="brand-titles">
        <div class="online-pill">
          <span class="online-dot"></span>
          <span>ONLINE</span>
        </div>
        <h1 class="brand-heading lime-glow">XANANTH // NET-DECK</h1>
      </div>
    </div>

    <!-- Right: Clock & CRT FX Toggle -->
    <div class="system-controls">
      <span id="clockReadout" class="clock-readout">AEST --:--</span>

      <div id="crtToggle" class="crt-toggle-wrap" role="switch" aria-checked="true" tabindex="0" title="Toggle CRT Scanline & Phosphor FX">
        <span id="crtLabel">[CRT FX: ON]</span>
        <div class="crt-switch">
          <div class="crt-switch-thumb"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       MAIN WORKSPACE (CLEAN SPA LAUNCHER GRID)
       ========================================================================= -->
  <main class="main-shell">
    <section aria-label="Application Modules">
      <div id="spaGrid" class="spa-grid">
        <!-- Populated dynamically from ./modules.json -->
      </div>
    </section>

    <!-- =========================================================================
         FOOTER DOCK
         ========================================================================= -->
    <footer class="footer-dock">
      <div class="badge-wall">
        <a href="https://youtube.com/day9tv" target="_blank" rel="noopener noreferrer" class="retro-badge">Inspiration</a>
        <a href="https://webfpv.org" target="_blank" rel="noopener noreferrer" class="retro-badge">Motivation</a>
      </div>

      <div id="kbLegend" class="kb-legend">
        ESC to reset &nbsp;|&nbsp; Enter or 1–2 to launch
      </div>
    </footer>
  </main>

  <!-- =========================================================================
       APPLICATION LOGIC & EXTERNAL JSON MODULE LOADER
       ========================================================================= -->
  <script>
    const spaGrid = document.getElementById('spaGrid');
    const crtToggle = document.getElementById('crtToggle');
    const crtLabel = document.getElementById('crtLabel');
    const kbLegend = document.getElementById('kbLegend');

    let loadedModules = [];

    // Minimal default fallback SVG if a module in modules.json omits both "svg" and "image"
    const DEFAULT_FALLBACK_SVG = `
      <svg viewBox="0 0 480 142" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <rect width="480" height="142" fill="#0a0714"/>
        <g stroke="#23183b" stroke-width="1">
          <line x1="0" y1="47" x2="480" y2="47"/>
          <line x1="0" y1="94" x2="480" y2="94"/>
          <line x1="160" y1="0" x2="160" y2="142"/>
          <line x1="320" y1="0" x2="320" y2="142"/>
        </g>
        <polygon points="240,26 278,48 278,94 240,116 202,94 202,48" fill="rgba(141,229,0,0.08)" stroke="#8de500" stroke-width="1.5"/>
        <circle cx="240" cy="71" r="6" fill="#8de500"/>
        <path d="M 10,18 L 10,10 L 18,10 M 470,18 L 470,10 L 462,10 M 10,124 L 10,132 L 18,132 M 470,124 L 470,132 L 462,132" stroke="#8de500" stroke-width="1" fill="none" opacity="0.55"/>
      </svg>
    `;

    function getModuleArt(proj) {
      if (proj.svg) {
        return proj.svg;
      }
      if (proj.image) {
        return `<img src="${proj.image}" alt="${proj.title} preview" />`;
      }
      return DEFAULT_FALLBACK_SVG;
    }

    // =========================================================================
    // RENDER MODULE CARDS FROM JSON DATA
    // =========================================================================
    function renderSpaGrid(modules) {
      loadedModules = Array.isArray(modules) ? modules : [];

      spaGrid.innerHTML = loadedModules.map((proj, idx) => {
        const statusClass = (proj.status || 'LIVE').toLowerCase();
        const modNum = String(idx + 1).padStart(2, '0');
        const telemetryCode = proj.code || `MOD_${modNum}`;

        return `
          <article class="os-window spa-card" id="card-${proj.id}">
            <div class="win-titlebar">
              <span class="win-title-text">module://${modNum}_${proj.id}</span>
              <button class="win-close-btn" data-minimize="card-${proj.id}" title="Minimize Window">x</button>
            </div>

            <div class="spa-card-art">
              <span class="art-telemetry-tag">${telemetryCode}</span>
              ${getModuleArt(proj)}
            </div>

            <div class="win-body">
              <div>
                <div class="spa-card-top">
                  <h2 class="spa-title">${proj.title}</h2>
                  <span class="status-pill ${statusClass}">${proj.status || 'LIVE'}</span>
                </div>
                <div class="spa-tag-row">
                  Tag: ${proj.tag || 'Web Application'}
                </div>
                <p class="spa-desc">${proj.description || ''}</p>
              </div>

              <div>
                <div class="spa-actions">
                  <a href="${proj.url || '#'}" class="btn-launch">
                    LAUNCH &rarr;
                  </a>
                  <button class="btn-info" data-info-id="info-${proj.id}">
                    [INFO]
                  </button>
                  <span class="spa-shortcut-hint">[${idx + 1}]</span>
                </div>
                <div id="info-${proj.id}" class="spa-info-drawer">
                  ${proj.info || 'Standalone single-page web application.'}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      // Update footer keyboard range dynamically based on JSON module count
      if (kbLegend && loadedModules.length > 0) {
        const maxKey = Math.min(loadedModules.length, 9);
        const rangeText = maxKey > 1 ? `1–${maxKey}` : '1';
        kbLegend.innerHTML = `ESC to reset &nbsp;|&nbsp; Enter or ${rangeText} to launch`;
      }

      // Bind [INFO] drawer buttons
      spaGrid.querySelectorAll('.btn-info').forEach(btn => {
        btn.addEventListener('click', () => {
          const drawer = document.getElementById(btn.dataset.infoId);
          if (!drawer) return;
          drawer.classList.toggle('open');
          btn.classList.toggle('active');
        });
      });

      // Bind window minimize buttons
      document.querySelectorAll('[data-minimize]').forEach(btn => {
        btn.onclick = () => {
          const target = document.getElementById(btn.dataset.minimize);
          if (target) target.classList.toggle('minimized');
        };
      });
    }

    // =========================================================================
    // FETCH EXTERNAL ./modules.json
    // =========================================================================
    async function loadModules() {
      try {
        const response = await fetch('./modules.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} loading modules.json`);
        }
        const modules = await response.json();
        renderSpaGrid(modules);
      } catch (err) {
        console.error('Failed to load ./modules.json:', err);
        spaGrid.innerHTML = `
          <article class="os-window spa-card">
            <div class="win-titlebar">
              <span class="win-title-text">system://error_registry_offline</span>
            </div>
            <div class="win-body">
              <p class="spa-desc">
                Unable to load <strong>./modules.json</strong>. Make sure <code>modules.json</code> is in the same folder and served over HTTP/HTTPS (e.g., GitHub Pages or a local dev server).
              </p>
            </div>
          </article>
        `;
      }
    }

    // =========================================================================
    // CRT FX TOGGLE & LIVE AEST CLOCK
    // =========================================================================
    function toggleCrt() {
      const enabled = document.body.classList.toggle('crt-enabled');
      crtToggle.setAttribute('aria-checked', String(enabled));
      crtLabel.textContent = enabled ? '[CRT FX: ON]' : '[CRT FX: OFF]';
    }

    crtToggle.addEventListener('click', toggleCrt);
    crtToggle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleCrt();
      }
    });

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-AU', {
        timeZone: 'Australia/Brisbane',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      document.getElementById('clockReadout').textContent = `AEST ${timeStr}`;
    }
    updateClock();
    setInterval(updateClock, 15000);

    // =========================================================================
    // KEYBOARD SHORTCUTS (1-9, Enter, Esc)
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.os-window.minimized').forEach(w => w.classList.remove('minimized'));
        document.querySelectorAll('.spa-info-drawer.open').forEach(d => d.classList.remove('open'));
        document.querySelectorAll('.btn-info.active').forEach(b => b.classList.remove('active'));
        return;
      }

      if (e.key === 'Enter' && document.activeElement === document.body) {
        e.preventDefault();
        if (loadedModules[0] && loadedModules[0].url) {
          window.location.href = loadedModules[0].url;
        }
        return;
      }

      const num = parseInt(e.key, 10);
      if (!isNaN(num) && num >= 1 && num <= loadedModules.length) {
        e.preventDefault();
        window.location.href = loadedModules[num - 1].url;
      }
    });

    // Boot launcher
    loadModules();
  </script>
</body>
</html>
