<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XANANTH // NET-DECK</title>
  <!-- Google Fonts for Retro Display & Developer Monospace -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="master.css" />
</head>
<body class="crt-enabled">

  <!-- =========================================================================
       STICKY TOP SYSTEM BAR
       ========================================================================= -->
  <header class="top-bar">
    <!-- Left: Brand Logo & Status -->
    <div class="brand-cluster">
      <div class="brand-logo-wrap" title="Xananth // Net-Deck">
        <img src="Xananth Logo Fold 3 Inner~2.png" alt="Xananth Logo" onerror="this.style.display='none'; document.getElementById('xananth-svg-logo').style.display='block';" />
        <svg id="xananth-svg-logo" style="display:none;" viewBox="0 0 200 185" xmlns="http://www.w3.org/2000/svg">
          <g fill="#8de500">
            <polygon points="74,12 126,12 142,42 63,118 47,62" />
            <polygon points="36,80 51,131 24,157 8,130" />
            <polygon points="56,149 62,172 34,172" />
            <polygon points="150,58 192,130 168,172 75,172 68,139" />
          </g>
          <text x="77" y="164" fill="#050805" font-family="cursive, sans-serif" font-weight="900" font-style="italic" font-size="25" letter-spacing="0.5">ananth</text>
        </svg>
      </div>
      <div class="brand-titles">
        <div class="online-pill">
          <span class="online-dot"></span>
          <span>ONLINE</span>
        </div>
        <h1 class="brand-heading lime-glow">XANANTH // NET-DECK</h1>
      </div>
    </div>

    <!-- Right: Clock & CRT FX Toggle -->
    <div class="system-controls">
      <span id="clockReadout" class="clock-readout">AEST --:--</span>

      <div id="crtToggle" class="crt-toggle-wrap" role="switch" aria-checked="true" tabindex="0" title="Toggle CRT Scanline & Phosphor FX">
        <span id="crtLabel">[CRT FX: ON]</span>
        <div class="crt-switch">
          <div class="crt-switch-thumb"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       MAIN WORKSPACE
       ========================================================================= -->
  <main class="main-shell">
    <div class="workspace-grid">
      <!-- LEFT COLUMN: Personal Console -->
      <aside class="left-stack">
        <!-- Welcome Window -->
        <section class="os-window" id="win-welcome">
          <div class="win-titlebar">
            <span class="win-title-text">system://welcome</span>
            <button class="win-close-btn" data-minimize="win-welcome" title="Minimize Window">x</button>
          </div>
          <div class="win-body welcome-body">
            <div>
              <p class="welcome-copy">Welcome to my corner of the web...</p>
              <span class="welcome-sub">Single-page utilities, field tools &amp; local experiments.</span>
            </div>
            <!-- Pixel Art Avatar Portrait Frame -->
            <div class="avatar-frame" title="Operator: Xananth">
              <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                <rect width="16" height="16" fill="#101c14"/>
                <rect x="4" y="2" width="8" height="2" fill="#060a07"/>
                <rect x="3" y="3" width="10" height="2" fill="#060a07"/>
                <rect x="4" y="5" width="8" height="6" fill="#9cd69c"/>
                <rect x="5" y="7" width="2" height="2" fill="#060a07"/>
                <rect x="9" y="7" width="2" height="2" fill="#060a07"/>
                <rect x="5" y="7" width="1" height="1" fill="#8de500"/>
                <rect x="9" y="7" width="1" height="1" fill="#8de500"/>
                <rect x="6" y="10" width="4" height="1" fill="#1b3622"/>
                <rect x="3" y="12" width="10" height="4" fill="#1f3b28"/>
                <rect x="6" y="12" width="4" height="4" fill="#8de500"/>
              </svg>
            </div>
          </div>
        </section>
      </aside>

      <!-- RIGHT COLUMN: SPA LAUNCHER WINDOW -->
      <section>
        <div id="spaGrid" class="spa-grid">
          <!-- Populated dynamically from SPA_PROJECTS registry -->
        </div>
      </section>
    </div>

    <!-- =========================================================================
         FOOTER DOCK
         ========================================================================= -->
    <footer class="footer-dock">
      <div class="badge-wall">
        <a href="https://youtube.com/day9tv" target="_blank" rel="noopener noreferrer" class="retro-badge">Inspiration</a>
        <a href="https://webfpv.org" target="_blank" rel="noopener noreferrer" class="retro-badge">Motivation</a>
      </div>

      <div class="kb-legend">
        ESC to close / reset &nbsp;|&nbsp; Enter or 1–2 to launch
      </div>
    </footer>
  </main>

  <!-- =========================================================================
       PROJECT REGISTRY & APPLICATION LOGIC
       ========================================================================= -->
  <script>
    const SPA_PROJECTS = [
      {
        id: 'fishing-calendar',
        title: 'FISHING CALENDAR',
        status: 'LIVE',
        tag: 'Tools & Utilities',
        description: 'Interactive Sunshine Coast seasonal species matrix, tackle specs, and local fishing spots.',
        url: './fishingcal.html',
        info: '<strong>Build v1.4:</strong> 12-month seasonal matrix covering canals, estuaries, and offshore reefs—sortable by seasonal availability, eating quality, or species name, with tackle specs, local hotspots, and a light/dark mode toggle.'
      },
      {
        id: 'magepunk-character-creator',
        title: 'MAGEPUNK CHARACTER CREATOR',
        status: 'LIVE',
        tag: 'TTRPG & Character Matrix',
        description: '6-step TTRPG character builder, interactive play sheet, step-dice roller, and bidirectional Fari v6 JSON matrix.',
        url: './magepunk.html',
        info: '<strong>Fari v6 Matrix:</strong> Features a 6-step compilation wizard (identity, step-dice traits, skills, trade features, foci, grimoire, and wealth), an active play sheet with live HP/Mana and Fatigue/Demise trackers, an upsize/downsize step-dice roller (d4–d20) with Web Audio synth FX, 5 archetype presets, and full Fari v6 JSON import/export.'
      }
    ];

    const spaGrid = document.getElementById('spaGrid');
    const crtToggle = document.getElementById('crtToggle');
    const crtLabel = document.getElementById('crtLabel');

    // =========================================================================
    // RENDER SPA WINDOW CARD
    // =========================================================================
    function renderSpaGrid() {
      spaGrid.innerHTML = SPA_PROJECTS.map((proj, idx) => {
        const statusClass = proj.status.toLowerCase();
        return `
          <article class="os-window spa-card kb-focused" id="card-${proj.id}">
            <div class="win-titlebar">
              <span class="win-title-text">module://0${idx + 1}_${proj.id}</span>
              <button class="win-close-btn" data-minimize="card-${proj.id}" title="Minimize Window">x</button>
            </div>
            <div class="win-body">
              <div>
                <div class="spa-card-top">
                  <h2 class="spa-title">${proj.title}</h2>
                  <span class="status-pill ${statusClass}">${proj.status}</span>
                </div>
                <div class="spa-tag-row">
                  Tag: ${proj.tag}
                </div>
                <p class="spa-desc">${proj.description}</p>
              </div>

              <div>
                <div class="spa-actions">
                  <a href="${proj.url}" class="btn-launch">
                    LAUNCH &rarr;
                  </a>
                  <button class="btn-info" data-info-id="info-${proj.id}">
                    [INFO]
                  </button>
                  <span class="spa-shortcut-hint">[${idx + 1}]</span>
                </div>
                <div id="info-${proj.id}" class="spa-info-drawer">
                  ${proj.info || 'Standalone single-page application.'}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      spaGrid.querySelectorAll('.btn-info').forEach(btn => {
        btn.addEventListener('click', () => {
          const drawer = document.getElementById(btn.dataset.infoId);
          if (!drawer) return;
          drawer.classList.toggle('open');
          btn.classList.toggle('active');
        });
      });

      bindMinimizeButtons();
    }

    // =========================================================================
    // MINIMIZE WINDOW CHROME BEHAVIOR
    // =========================================================================
    function bindMinimizeButtons() {
      document.querySelectorAll('[data-minimize]').forEach(btn => {
        btn.onclick = () => {
          const target = document.getElementById(btn.dataset.minimize);
          if (target) target.classList.toggle('minimized');
        };
      });
    }

    // =========================================================================
    // CRT FX TOGGLE & LIVE AEST CLOCK
    // =========================================================================
    function toggleCrt() {
      const enabled = document.body.classList.toggle('crt-enabled');
      crtToggle.setAttribute('aria-checked', String(enabled));
      crtLabel.textContent = enabled ? '[CRT FX: ON]' : '[CRT FX: OFF]';
    }

    crtToggle.addEventListener('click', toggleCrt);
    crtToggle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleCrt();
      }
    });

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-AU', {
        timeZone: 'Australia/Brisbane',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      document.getElementById('clockReadout').textContent = `AEST ${timeStr}`;
    }
    updateClock();
    setInterval(updateClock, 15000);

    // =========================================================================
    // KEYBOARD SHORTCUTS (1-9, Enter, Esc)
    // =========================================================================
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.os-window.minimized').forEach(w => w.classList.remove('minimized'));
        return;
      }

      if (e.key === 'Enter' && document.activeElement === document.body) {
        e.preventDefault();
        if (SPA_PROJECTS[0]) {
          window.location.href = SPA_PROJECTS[0].url;
        }
        return;
      }

      const num = parseInt(e.key, 10);
      if (!isNaN(num) && num >= 1 && num <= SPA_PROJECTS.length) {
        e.preventDefault();
        window.location.href = SPA_PROJECTS[num - 1].url;
      }
    });

    // Initialize Hub
    renderSpaGrid();
    bindMinimizeButtons();
  </script>
</body>
</html>
